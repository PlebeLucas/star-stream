name: Build do app (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Baixar FFmpeg (precisa do filtro gfxcapture)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/bin | Out-Null
          # Tenta duas fontes de build do FFmpeg; usa a primeira que tiver o filtro gfxcapture
          $sources = @(
            @{ url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"; file = "ffmpeg.zip" },
            @{ url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-git-full.7z"; file = "ffmpeg.7z" }
          )
          $ok = $false
          foreach ($s in $sources) {
            Remove-Item -Recurse -Force ffmpeg-tmp -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest $s.url -OutFile $s.file
              if ($s.file -like "*.7z") { 7z x $s.file -offmpeg-tmp -y | Out-Null } else { Expand-Archive $s.file -DestinationPath ffmpeg-tmp }
              $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              $filters = & $exe.FullName -hide_banner -filters
              if ($filters | Select-String "gfxcapture") {
                Copy-Item $exe.FullName app/src-tauri/bin/ffmpeg.exe
                Write-Host "FFmpeg OK com gfxcapture: $($s.url)"
                $ok = $true
                break
              }
              Write-Host "Sem gfxcapture em $($s.url), tentando a proxima"
            } catch { Write-Host "Falhou $($s.url): $_" }
          }
          if (-not $ok) { throw "Nenhum FFmpeg com gfxcapture encontrado" }

      - name: Testes do núcleo
        working-directory: core
        run: cargo test --lib

      - name: Instalar dependências do app
        working-directory: app
        run: npm install

      # Gera o instalador, assina a atualização e publica a versão na aba Releases.
      # Os apps já instalados nos amigos baixam essa versão sozinhos.
      - name: Build e publicação
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAR_SIGNAL_URL: ${{ vars.STAR_SIGNAL_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: STAR Stream v__VERSION__
          releaseBody: Baixe o instalador abaixo, instale e abra. As próximas versões chegam sozinhas.
          releaseDraft: false
          prerelease: false
