[package]
name = "star-core"
version = "0.1.0"
edition = "2021"
description = "STAR // STREAM: captura, encoder da GPU e WebRTC P2P"

[dependencies]
webrtc = "=0.17.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
bytes = "1"
audiopus = "0.3.0-rc.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
] }
windows-core = "0.62"

[dev-dependencies]
env_logger = "0.11"
